<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>RaDi Latvieši — design directions</title>
	<style>
		* { box-sizing: border-box; }
		body { margin: 0; font: 15px/1.5 -apple-system, "Segoe UI", Helvetica, sans-serif; background: #121316; color: #ececec; }
		header { padding: 18px 22px; border-bottom: 1px solid rgba(255,255,255,.12); }
		header h1 { font-size: .95rem; margin: 0 0 4px; letter-spacing: .04em; }
		header p { margin: 0; color: #8f8f8f; font-size: .82rem; }
		nav { display: flex; gap: 8px; padding: 14px 22px; flex-wrap: wrap; align-items: center; }
		nav button { background: transparent; border: 1px solid rgba(255,255,255,.22); color: inherit; padding: 8px 15px; border-radius: 6px; cursor: pointer; font: inherit; font-size: .84rem; }
		nav button.active { background: #ececec; color: #121316; border-color: #ececec; font-weight: 700; }
		nav a { margin-left: auto; color: #8f8f8f; font-size: .8rem; }
		.desc { padding: 0 22px 12px; color: #9a9a9a; font-size: .84rem; max-width: 70ch; }
		.frame-wrap { padding: 0 22px 22px; }
		iframe { width: 100%; height: calc(100vh - 210px); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: #fff; }
	</style>
</head>
<body>
	<header>
		<h1>RaDi Latvieši — three design directions</h1>
		<p>Same content, three different structures &amp; interaction models. Pick one and it becomes the site.</p>
	</header>
	<nav>
		<button data-src="index.html" data-desc="The current live site — warm editorial layout, vertical scroll.">Current</button>
		<button data-src="designs/arkivs/index.html" class="active" data-desc="ARKĪVS — a horizontal archive drawer. Fixed vertical spine holds the wordmark and index; the site scrolls sideways like a contact sheet, panel by panel, with catalogue metadata in mono type and duotone photography. Collapses to a normal vertical stack on mobile.">1 · Arkīvs</button>
		<button data-src="designs/balsis/index.html" data-desc="BALSIS — a radio station on the page. Dark, oversized display type; a persistent transport bar pinned to the bottom tracks your position and steps between sections; stories are a tracklist with durations; portraits are circular portholes; the manifesto slab is cut on the diagonal.">2 · Balsis</button>
		<button data-src="designs/tikls/index.html" data-desc="TĪKLS — a wall of tiles. The whole site is one modular bento poster on a visible black grid: statement, photo, year, manifesto, stories, team and contact all on screen at once. A scrolling ticker runs up top; tap any tile to open it full-screen.">3 · Tīkls</button>
		<a href="index.html">open live site &#8599;</a>
	</nav>
	<p class="desc" id="desc"></p>
	<div class="frame-wrap"><iframe id="frame" title="design preview"></iframe></div>
	<script>
		const buttons = [...document.querySelectorAll('nav button')];
		const frame = document.getElementById('frame');
		const desc = document.getElementById('desc');
		function show(btn) {
			buttons.forEach(b => b.classList.toggle('active', b === btn));
			frame.src = btn.dataset.src;
			desc.textContent = btn.dataset.desc;
		}
		buttons.forEach(b => b.addEventListener('click', () => show(b)));
		show(buttons.find(b => b.classList.contains('active')));
	</script>
</body>
</html>
